services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: atnos-n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    environment:
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - N8N_HOST=${N8N_HOST:-127.0.0.1}
      - N8N_EDITOR_BASE_URL=${N8N_EDITOR_BASE_URL:-http://127.0.0.1:5678}
      - WEBHOOK_URL=${WEBHOOK_URL:-http://127.0.0.1:5678/}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-Europe/Warsaw}
      - TZ=${TZ:-Europe/Warsaw}
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=${N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS:-true}
      - N8N_RUNNERS_ENABLED=${N8N_RUNNERS_ENABLED:-true}
      - N8N_DIAGNOSTICS_ENABLED=${N8N_DIAGNOSTICS_ENABLED:-false}
      - N8N_PERSONALIZATION_ENABLED=${N8N_PERSONALIZATION_ENABLED:-false}
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=${EXECUTIONS_DATA_SAVE_ON_SUCCESS:-none}
      - EXECUTIONS_DATA_SAVE_ON_ERROR=${EXECUTIONS_DATA_SAVE_ON_ERROR:-all}
      - ATNOS_API_BASE_URL=${ATNOS_API_BASE_URL:-http://host.docker.internal:8000}
      - N8N_ATNOS_WEBHOOK_TOKEN=${N8N_ATNOS_WEBHOOK_TOKEN:-}
    volumes:
      - E:/Atnos/Profiles/AtnosSystem/AppData/Roaming/Atnos/data/n8n/home:/home/node/.n8n
      - E:/Atnos/Profiles/AtnosSystem/AppData/Roaming/Atnos/data:/atnos-data
      - E:/Atnos/App/automations/n8n:/atnos-n8n:ro
