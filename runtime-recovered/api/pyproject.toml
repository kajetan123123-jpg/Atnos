[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atnos-api"
version = "0.1.0"
description = "Phase 1 backend foundation for the Atnos."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.16.0,<2.0.0",
    "apscheduler>=3.10.4,<4.0.0",
    "cryptography>=42.0.0,<49.0.0",
    "edge-tts>=7.2.3,<8.0.0",
    "fastapi>=0.136.0,<1.0.0",
    "google-api-python-client>=2.181.0,<3.0.0",
    "google-auth>=2.40.0,<3.0.0",
    "google-auth-oauthlib>=1.2.2,<2.0.0",
    "gradio_client>=2.0.0,<3.0.0",
    "httpx>=0.28.0,<1.0.0",
    "jsonschema>=4.23.0,<5.0.0",
    "huggingface_hub>=0.34.0,<1.0.0",
    "imageio-ffmpeg>=0.5.0,<1.0.0",
    "kokoro-onnx>=0.4.7,<0.5.0",
    "espeakng-loader>=0.2.4,<0.3.0",
    "openpyxl>=3.1.5,<4.0.0",
    "paramiko>=3.5.1,<4.0.0",
    "Pillow>=11.0.0,<12.0.0",
    "playwright>=1.54.0,<2.0.0",
    "pyautogui>=0.9.54,<1.0.0",
    "pyperclip>=1.9.0,<2.0.0",
    "pypdf>=5.4.0,<6.0.0",
    "pydantic-settings>=2.14.0,<3.0.0",
    "python-docx>=1.1.2,<2.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "python-frontmatter>=1.1.0,<2.0.0",
    "python-multipart>=0.0.20,<1.0.0",
    "python-pptx>=1.0.2,<2.0.0",
    "PyYAML>=6.0.2,<7.0.0",
    "psutil>=7.0.0,<8.0.0",
    "pytrends>=4.9.2,<5.0.0",
    "pyttsx3>=2.99,<3.0.0",
    "reportlab>=4.4.0,<5.0.0",
    "sqlalchemy>=2.0.0,<3.0.0",
    "soundfile>=0.13.0,<1.0.0",
    "uvicorn>=0.45.0,<1.0.0",
    "websockets>=15.0.0,<16.0.0",
    "scrapling==0.4.15",
    "scenedetect-headless==0.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.1,<9.0.0",
]
ambient = [
    "openwakeword>=0.6.0,<1.0.0",
    "PyAudio>=0.2.14,<0.3.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
