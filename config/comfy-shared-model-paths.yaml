# Atnos-owned ComfyUI model paths. Keep project data outside the system disk.
comfy.atnos:
  base_path: 'E:\Atnos\Tools\Comfy-Desktop\ComfyUI-Shared\models'
  is_default: true
  checkpoints: 'checkpoints/'
  classifiers: 'classifiers/'
  clip_vision: 'clip_vision/'
  configs: 'configs/'
  controlnet: |-
    controlnet/
    t2i_adapter/
  diffusers: 'diffusers/'
  diffusion_models: 'diffusion_models/'
  embeddings: 'embeddings/'
  gligen: 'gligen/'
  hypernetworks: 'hypernetworks/'
  latent_upscale_models: 'latent_upscale_models/'
  loras: 'loras/'
  model_patches: 'model_patches/'
  audio_encoders: 'audio_encoders/'
  photomaker: 'photomaker/'
  style_models: 'style_models/'
  text_encoders: 'text_encoders/'
  upscale_models: 'upscale_models/'
  background_removal: 'background_removal/'
  frame_interpolation: 'frame_interpolation/'
  geometry_estimation: 'geometry_estimation/'
  optical_flow: 'optical_flow/'
  detection: 'detection/'
  vae: 'vae/'
  vae_approx: 'vae_approx/'
  clip: 'clip/'
  unet: 'unet/'

# Cold storage for models that are retained for compatibility but are not part
# of the stable Windows/ROCm production path. Keeping them on D: preserves the
# workflows without consuming the fast F: model volume.
comfy.atnos_cold:
  base_path: 'E:\Atnos\Storage\Models\ComfyUI-Cold'
  checkpoints: 'checkpoints/'
  clip: 'clip/'
  text_encoders: 'text_encoders/'
  vae: 'vae/'
